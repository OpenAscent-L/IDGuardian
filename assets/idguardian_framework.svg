<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">IDGuardian framework</title>
  <desc id="desc">Clean image and zero perturbation are optimized through CLIP and FaceNet identity loss and an IP-Adapter SDXL score bridge to produce a protected image.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#059669"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 18px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 16px Arial, sans-serif; fill: #334155; }
      .small { font: 400 14px Arial, sans-serif; fill: #64748b; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1500" height="620" rx="28" fill="#f8fafc"/>
  <text x="750" y="54" text-anchor="middle" class="title">IDGuardian: Dual-Stage Identity Protection</text>
  <text x="750" y="84" text-anchor="middle" class="small">Cross-Encoder Identity Field Confounding + Guidance-Flow Identity Deflection</text>

  <g>
    <rect x="55" y="190" width="235" height="190" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1210" y="190" width="235" height="190" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <rect x="555" y="220" width="390" height="135" rx="22" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>

  <rect x="82" y="220" width="180" height="92" rx="12" fill="#e0e7ff"/>
  <circle cx="115" cy="250" r="17" fill="#4f46e5"/>
  <path d="M107 250h16M115 242v16" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="172" y="253" text-anchor="middle" class="label">Clean image x</text>
  <text x="172" y="279" text-anchor="middle" class="small">reference face</text>
  <text x="172" y="340" text-anchor="middle" class="body">delta = 0</text>

  <rect x="1237" y="220" width="180" height="92" rx="12" fill="#d1fae5"/>
  <circle cx="1271" cy="250" r="17" fill="#059669"/>
  <path d="M1263 250h16M1271 242v16" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="1327" y="253" text-anchor="middle" class="label">Protected image</text>
  <text x="1327" y="279" text-anchor="middle" class="small">x + delta</text>
  <text x="1327" y="340" text-anchor="middle" class="body">||delta||∞ ≤ 8/255</text>

  <path d="M290 260 C390 260 430 230 540 260" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M290 320 C390 320 430 345 540 320" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="408" y="230" text-anchor="middle" class="small">clean conditions</text>
  <text x="408" y="370" text-anchor="middle" class="small">protected conditions</text>

  <text x="750" y="258" text-anchor="middle" class="white section">IP-Adapter SDXL Plus Face</text>
  <text x="750" y="288" text-anchor="middle" class="white body">VAE + UNet + CLIP image encoder</text>
  <text x="750" y="320" text-anchor="middle" class="white body">clean/protected denoising predictions</text>

  <g>
    <rect x="350" y="455" width="340" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="810" y="455" width="340" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="520" y="488" text-anchor="middle" class="section">Identity loss</text>
  <text x="520" y="516" text-anchor="middle" class="body">cos(CLIP(x), CLIP(x + delta))</text>
  <text x="520" y="540" text-anchor="middle" class="body">+ cos(FaceNet(x), FaceNet(x + delta))</text>
  <text x="980" y="488" text-anchor="middle" class="section">Score bridge</text>
  <text x="980" y="516" text-anchor="middle" class="body">S* = -(eps_adv - eps_clean)</text>
  <text x="980" y="540" text-anchor="middle" class="body">upsample and align to RGB</text>

  <path d="M610 355 C580 395 545 420 520 448" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M845 355 C880 395 930 420 980 448" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <path d="M690 505 C725 505 775 505 810 505" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M1150 505 C1190 505 1215 445 1260 385" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="750" y="596" text-anchor="middle" class="small">total grad = Normalize(grad_identity) - Normalize(S*)  |  delta ← delta - alpha · sign(total grad)</text>
</svg>
